services:
  mi-gpt-hermes:
    image: ${MIGPT_IMAGE:-ghcr.io/gatanozoa/mi-gpt-hermes:latest}
    container_name: mi-gpt-hermes
    restart: unless-stopped
    stop_grace_period: 4m
    networks:
      - hermes-voice
    env_file: .env
    volumes:
      - ./data:/data
    environment:
      TZ: Asia/Shanghai
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'

networks:
  hermes-voice:
    external: true
    name: hermes-voice
