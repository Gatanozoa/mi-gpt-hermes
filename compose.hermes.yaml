services:
  mi-gpt-hermes:
    image: ${MIGPT_IMAGE:?请设置 GitHub Actions 构建的镜像地址}
    container_name: mi-gpt-hermes
    restart: unless-stopped
    # 通过 Hermes 容器的网络空间访问其回环接口；容器名需与部署环境一致。
    network_mode: container:hermes
    env_file: .env
    volumes:
      - ./data:/data
    environment:
      TZ: Asia/Shanghai
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
